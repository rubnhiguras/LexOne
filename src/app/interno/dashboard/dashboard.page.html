<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-card color="primary">
          <ion-card-content>
            <h1>{{ queriesPendientes }}</h1>
            <p>Pendientes</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card color="secondary">
          <ion-card-content>
            <h1>{{ queriesRespondidas }}</h1>
            <p>Respondidas</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
